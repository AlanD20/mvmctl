version: '1'
traffic_policy:
  api:
    source_network: k8s
    destination_floating_ip: k8s-api
    destination_network: k8s
    protocol: tcp
    port: '6443'
  vxlan:
    source_labels:
      cluster: k8s-ha
    destination_labels:
      cluster: k8s-ha
    protocol: udp
    port: '8472'
  cilium-health:
    source_labels:
      cluster: k8s-ha
    destination_labels:
      cluster: k8s-ha
    protocol: tcp
    port: '4240'
  kubelet:
    source_labels:
      cluster: k8s-ha
      role: controller
    destination_labels:
      cluster: k8s-ha
    protocol: tcp
    port: '10250'
  etcd:
    source_labels:
      cluster: k8s-ha
      role: controller
    destination_labels:
      cluster: k8s-ha
      role: controller
    protocol: tcp
    port: '2379-2380'
exec_policy:
  controller-join:
    source_labels:
      cluster: k8s-ha
      joins: controller
    destination_vm: controller-1
    target_user: controller-reader
  worker-join:
    source_labels:
      cluster: k8s-ha
      role: worker
    destination_vm: controller-1
    target_user: worker-reader
