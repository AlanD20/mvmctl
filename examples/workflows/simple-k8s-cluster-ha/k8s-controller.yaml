version: '1'
network:
  k8s:
    subnet: 10.10.0.0/16
    nat_enabled: true
key:
  k8s-key:
    algorithm: ed25519
kernel:
  full-kernel:
    type: official
    version: 7.0.11
    features: all
binary:
  fc-binary:
    type: firecracker
    version: 1.16.0
vm:
  controller-1:
    labels:
      cluster: k8s-ha
      role: controller
    network: '@network:k8s'
    guest_ip: 10.10.0.10
    key: '@key:k8s-key'
    image: k8s-base
    kernel: '@kernel:full-kernel'
    binary: '@binary:fc-binary'
    vcpu: 2
    mem: 2G
    disk_size: 8G
    writeback: true
    depends_on:
    - '@network:k8s'
    - '@key:k8s-key'
    - '@kernel:full-kernel'
    - '@binary:fc-binary'
  controller-2:
    labels:
      cluster: k8s-ha
      role: controller
      joins: controller
    network: '@network:k8s'
    guest_ip: 10.10.0.11
    key: '@key:k8s-key'
    image: k8s-base
    kernel: '@kernel:full-kernel'
    binary: '@binary:fc-binary'
    vcpu: 2
    mem: 2G
    disk_size: 8G
    writeback: true
    depends_on:
    - '@network:k8s'
    - '@key:k8s-key'
    - '@kernel:full-kernel'
    - '@binary:fc-binary'
  controller-3:
    labels:
      cluster: k8s-ha
      role: controller
      joins: controller
    network: '@network:k8s'
    guest_ip: 10.10.0.12
    key: '@key:k8s-key'
    image: k8s-base
    kernel: '@kernel:full-kernel'
    binary: '@binary:fc-binary'
    vcpu: 2
    mem: 2G
    disk_size: 8G
    writeback: true
    depends_on:
    - '@network:k8s'
    - '@key:k8s-key'
    - '@kernel:full-kernel'
    - '@binary:fc-binary'
floating_ip:
  k8s-api:
    network: '@network:k8s'
    name: k8s-api
    ipv4: 10.10.0.100
    depends_on:
    - '@network:k8s'
floating_ip_grant:
  api-controllers:
    network: '@network:k8s'
    resource: '@floating_ip:k8s-api'
    vms:
      - '@vm:controller-1'
      - '@vm:controller-2'
      - '@vm:controller-3'
    methods:
      - method: inspect
      - method: associate
        lease: 10s
      - method: renew
        lease: 10s
      - method: release
    depends_on:
      - '@floating_ip:k8s-api'
      - '@vm:controller-1'
      - '@vm:controller-2'
      - '@vm:controller-3'
